name = "YAML Nunjucks"
grammar = "yaml_nunjucks"
path_suffixes = ["njk"]
line_comments = ["#"]
tab_size = 2
hard_tabs = false

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = false },
  { start = "{{", end = "}}", close = true, newline = false },
  { start = "{%", end = "%}", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]

auto_close_before = ";:.,=}])> \n"
